<script src="js/main.js"></script>
<script>
/* 讨论区：giscus（GitHub Discussions 驱动）
 * 全站共用一个讨论串，term 固定为 "讨论区"；
 * 若以后想给每篇文章单独开评论区，把 term 换成文章 id 即可。 */
(function () {
  var GISCUS = {
    repo: "60777flowers/60777flowers.github.io",
    repoId: "R_kgDOGacE0w",
    category: "Announcements",
    categoryId: "DIC_kwDOGacE084DKWci",
    term: "讨论区"
  };

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  }

  var s = document.createElement("script");
  s.src = "https://giscus.app/client.js";
  s.async = true;
  s.crossOrigin = "anonymous";
  s.setAttribute("data-repo", GISCUS.repo);
  s.setAttribute("data-repo-id", GISCUS.repoId);
  s.setAttribute("data-category", GISCUS.category);
  s.setAttribute("data-category-id", GISCUS.categoryId);
  s.setAttribute("data-mapping", "specific");
  s.setAttribute("data-term", GISCUS.term);
  s.setAttribute("data-strict", "0");
  s.setAttribute("data-reactions-enabled", "1");
  s.setAttribute("data-emit-metadata", "0");
  s.setAttribute("data-input-position", "bottom");
  s.setAttribute("data-theme", currentTheme());
  s.setAttribute("data-lang", "zh-CN");
  s.setAttribute("data-loading", "lazy");
  document.getElementById("giscus-container").appendChild(s);

  /* 跟随站点深浅色切换（giscus 官方 ISetConfigMessage 接口） */
  var siteToggle = window.toggleTheme;
  window.toggleTheme = function () {
    siteToggle();
    var f = document.querySelector("iframe.giscus-frame");
    if (f) {
      f.contentWindow.postMessage(
        { giscus: { setConfig: { theme: currentTheme() } } },
        "https://giscus.app"
      );
    }
  };
})();
</script>
</body>
</html>
