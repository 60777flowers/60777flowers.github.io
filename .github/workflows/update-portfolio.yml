name: Update portfolio

on:
  schedule:
    # A 股 15:00 收盘，这里留出收盘价落库的余量
    # 实测线上触发比字面时刻早约 15 小时（10-12 的 07:35 落在 10-12 16:54），故按实测偏移校准
    - cron: '40 22 * * 0-4'
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只抓行情并打印结果，不写入、不推送'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"

      - name: Update portfolio NAV
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== 演练模式：只抓行情，不写入 =="
            python scripts/auto_update.py --dry-run --force
          else
            python scripts/auto_update.py --push
          fi
