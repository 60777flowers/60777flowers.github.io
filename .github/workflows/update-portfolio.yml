name: Update portfolio

on:
  schedule:
    # 北京时间 15:05 收盘后的整个晚上每小时触发一次（UTC 7:10~16:10，
    # 最后一档相当于北京时间次日 0:10，用于兜底）。
    # GitHub 的 schedule 实测有 2~9 小时排队延迟，触发时刻并不可控——
    # 因此不追求"准点"，改为高频触发 + 脚本内部门控:
    #   未收盘 -> 只读不写；已收盘 -> 写入当日；晚上全部被延迟错过 -> 次日自动补录。
    # 多次触发只有第一次真正写入，其余幂等跳过。
    - cron: '10 7-16 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只抓行情并打印结果，不写入、不推送'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"

      - name: Update portfolio NAV
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== 演练模式：只抓行情，不写入 =="
            python scripts/auto_update.py --dry-run --force
          else
            python scripts/auto_update.py --push
          fi
