name: Update portfolio

on:
  schedule:
    # UTC 时间；北京时间 15:35 / 20:00（第二个时间点兜底），仅工作日
    - cron: '35 7 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"

      - name: Update portfolio NAV
        run: python scripts/auto_update.py --push
