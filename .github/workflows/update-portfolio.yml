name: Update portfolio

on:
  schedule:
    # UTC 时间；北京时间 15:35 / 20:00（第二个时间点兜底），仅工作日
    - cron: '35 7 * * 1-5'
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只抓行情并打印结果，不写入、不推送'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"

      - name: Update portfolio NAV
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== 演练模式：只抓行情，不写入 =="
            python scripts/auto_update.py --dry-run --force
          else
            python scripts/auto_update.py --push
          fi
