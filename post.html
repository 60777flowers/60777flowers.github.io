<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 | 杨凯盛</title>
<link rel="icon" href="img/favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="nav-logo" href="index.html">杨凯盛</a>
    <div class="nav-links">
      <a data-page="index.html" href="index.html">首页</a>
      <a data-page="about.html" href="about.html">关于我</a>
      <a data-page="blog.html" href="blog.html">博客文章</a>
      <a data-page="portfolio.html" href="portfolio.html">投资组合</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><i class="fas fa-adjust"></i></button>
    </div>
  </div>
</nav>

<div class="container post-page">
  <h1 id="post-title"></h1>
  <div class="post-meta" id="post-meta"></div>
  <div class="post-body" id="post-body"></div>
  <a class="back-link" href="blog.html">← 返回文章列表</a>
</div>

<footer class="footer">
  <div class="container">© 2022 - <span id="year"></span> 杨凯盛 · Powered by GitHub Pages</div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");
  var post = window.POSTS.find(function (p) { return p.id === id; }) || window.POSTS[0];
  document.title = post.title + " | 杨凯盛";
  document.getElementById("post-title").textContent = post.title;
  document.getElementById("post-meta").innerHTML =
    '<span class="tag">' + post.tag + '</span> · <i class="far fa-calendar-alt"></i> ' + post.date + " · kssss";
  var body = document.getElementById("post-body");
  post.content.forEach(function (line) {
    var p = document.createElement("p");
    var urlMatch = line.match(/(https?:\/\/\S+)/);
    if (urlMatch) {
      var parts = line.split(urlMatch[1]);
      p.append(document.createTextNode(parts[0]));
      var a = document.createElement("a");
      a.href = urlMatch[1];
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = urlMatch[1];
      p.appendChild(a);
      p.append(document.createTextNode(parts[1] || ""));
    } else {
      p.textContent = line;
    }
    body.appendChild(p);
  });
})();
</script>
</body>
</html>
